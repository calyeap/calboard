<!doctype html>
<html><head><meta charset="utf-8"><title>doc-overflow</title>
<style>
  /* Stands in for the CSS custom property next/font/google's IBM_Plex_Sans
     sets at runtime (app/layout.tsx: variable: "--font-ibm-plex-sans"). A
     standalone fixture has no Next.js to supply it, and an unresolved var()
     invalidates the whole font-family declaration rather than skipping to the
     next fallback — so without this, .cb-analyzer computes the browser
     default serif and this fixture would trip checkFont too, not just
     checkOverflow. */
  :root { --font-ibm-plex-sans: "IBM Plex Sans"; }
  body { margin: 0; }
  .cb-analyzer {
    font-family: var(--font-ibm-plex-sans), "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Deliberately no overflow-x: auto anywhere — unlike overflow.html, nothing
     here creates its own scroll container, so the wide card's overflow is
     not contained and propagates to the document itself. That is the limb
     this fixture exists to prove: document.documentElement.scrollWidth >
     window.innerWidth, exercised through the real probe rather than a
     hand-built ProbeDocument literal.

     Note: .cb-analyzer's own node-level scrollOverflow also trips here —
     a browser's scrollWidth measures actual content extent regardless of
     the overflow property, so a child overflowing an ancestor makes the
     ancestor's own scrollWidth exceed its clientWidth whether or not that
     ancestor clips or scrolls it. Both limbs firing together is expected;
     it is the "document overflows" fault this fixture is here to prove. */
  .card { width: 3000px; padding: 12px; }
</style></head>
<body><div class="cb-analyzer"><div class="card">Fact acquisition and spot-check</div></div></body></html>
